<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08070e">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Explore anime details, episode schedules, legal streaming options and track your progress on {{ app_name }}.">
  <meta property="og:site_name" content="{{ app_name }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ app_name }} — Anime details">
  <meta property="og:description" content="Explore anime details, episode schedules and track your progress.">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <title>{{ app_name }} — Anime details</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    /* Page-only extras that work with style.css */
    .skip-link{position:absolute;left:16px;top:-60px;z-index:100;padding:10px 16px;border-radius:999px;background:var(--grad);color:#100b1b;font:700 12px "DM Sans",sans-serif;transition:top .25s}
    .skip-link:focus{top:12px}
    .back-link{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid #ffffff17;border-radius:999px;background:#ffffff08;transition:color .2s,border-color .2s,background .2s,transform .2s}
    .back-link:hover{border-color:#b69aff88;background:#b69aff14;transform:translateX(-3px)}
    .detail-loading{display:flex;align-items:center;justify-content:center;gap:4px;min-height:60vh}
    .to-top{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:40;width:44px;height:44px;display:grid;place-items:center;border:1px solid #b69aff66;border-radius:50%;background:#0b0913e6;color:#e5d9ff;font-size:18px;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px #0008,0 0 24px #a78bfa25;opacity:0;transform:translateY(16px) scale(.9);pointer-events:none;transition:opacity .3s,transform .3s var(--ease),background .2s}
    .to-top.show{opacity:1;transform:none;pointer-events:auto}
    .to-top:hover{background:#b69aff2c}
    footer .brand{font-size:15px}
    footer .brand-mark{width:28px;height:28px;font-size:16px;border-radius:9px}
    @media(max-width:650px){.back-text{display:none}.back-link{padding:8px 12px}.topbar{gap:10px}}
    @media(prefers-reduced-motion:reduce){.skip-link,.to-top,.back-link{transition:none}}
  </style>
</head>
<body>
  <a class="skip-link" href="#detail-root">Skip to content</a>

  <!-- Ambient background glow (styled and animated by style.css) -->
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="/" aria-label="{{ app_name }} home"><span class="brand-mark">X</span><span>ANIME<span class="brand-accent">X</span></span></a>
    <nav class="desktop-nav" aria-label="Main">
      <a href="/">Discover</a>
      <a href="/#trending">Trending</a>
      <a href="/library">My library</a>
    </nav>
    <a class="auth-nav" href="/login" id="auth-nav">Sign in</a>
    <a class="back-link" href="/" aria-label="Back to discover">← <span class="back-text">Back to discover</span></a>
    <button class="mobile-menu" id="mobile-menu" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-nav">☰</button>
  </header>

  <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile" hidden>
    <a href="/">Discover</a>
    <a href="/#trending">Trending</a>
    <a href="/library">My library</a>
    <a href="/login" id="mobile-auth-link">Sign in</a>
  </nav>

  <main class="detail-main" id="detail-root" data-anime-id="{{ anime_id }}" aria-live="polite" aria-busy="true">
    <div class="status detail-loading"><span class="live-dot"></span> Loading anime details...</div>
    <noscript><div class="status detail-error">JavaScript is required to view anime details.<p><a class="primary-btn" href="/">Return home</a></p></div></noscript>
  </main>

  <button class="to-top" id="to-top" type="button" aria-label="Back to top">↑</button>

  <footer>
    <a class="brand" href="/" aria-label="{{ app_name }} home"><span class="brand-mark">X</span><span>ANIME<span class="brand-accent">X</span></span></a>
    <span>AnimeX · Discover beyond the ordinary.</span>
    <span class="footer-status">ANIME DETAILS</span>
  </footer>

  <script>window.ANIMEX_CONFIG = {{ {"supabaseUrl": supabase_url, "supabaseAnonKey": supabase_anon_key}|tojson }};</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="{{ url_for('static', filename='js/auth-client.js') }}"></script>
  <script src="{{ url_for('static', filename='js/detail.js') }}"></script>

  <script>
    // Page chrome: auth-aware nav, mobile menu, back-to-top, busy state
    (() => {
      // Signed-in users see "My library" instead of "Sign in"
      (async () => {
        const auth = window.AnimeXAuth;
        const links = [document.getElementById("auth-nav"), document.getElementById("mobile-auth-link")];
        if (!auth?.ready) return;
        try {
          if (await auth.session()) {
            links.forEach(a => { if (a) { a.href = "/library"; a.textContent = "My library"; } });
          }
        } catch (e) { /* stay on Sign in */ }
      })();

      // Mobile menu with accessible open/close state
      const toggle = document.getElementById("mobile-menu");
      const menu = document.getElementById("mobile-nav");
      if (toggle && menu) {
        const close = () => {
          menu.hidden = true;
          toggle.setAttribute("aria-expanded", "false");
          toggle.setAttribute("aria-label", "Open menu");
          toggle.textContent = "☰";
        };
        toggle.addEventListener("click", () => {
          const opening = menu.hidden;
          menu.hidden = !opening;
          toggle.setAttribute("aria-expanded", String(opening));
          toggle.setAttribute("aria-label", opening ? "Close menu" : "Open menu");
          toggle.textContent = opening ? "×" : "☰";
        });
        menu.addEventListener("click", e => { if (e.target.closest("a")) close(); });
        document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
        window.matchMedia("(min-width: 651px)").addEventListener("change", close);
      }

      // Back-to-top button
      const top = document.getElementById("to-top");
      if (top) {
        const onScroll = () => top.classList.toggle("show", window.scrollY > 600);
        window.addEventListener("scroll", onScroll, { passive: true });
        top.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
        onScroll();
      }

      // Clear aria-busy once detail.js has rendered something other than the loader
      const root = document.getElementById("detail-root");
      if (root) {
        const done = new MutationObserver(() => {
          if (!root.querySelector(".detail-loading")) { root.setAttribute("aria-busy", "false"); done.disconnect(); }
        });
        done.observe(root, { childList: true });
      }
    })();
  </script>
</body>
</html>
